<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ゆかめし - ひまわりご飯ノート 🌻</title>
  <style>
    :root {
      --primary: #FFB703;
      --primary-hover: #FB8500;
      --bg: #FFFDF8;
      --card-bg: #FFFFFF;
      --text: #333333;
      --accent: #E63946;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      padding: 20px;
      box-sizing: border-box;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header h1 {
      font-size: 1.5rem;
      color: var(--primary-hover);
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    header p {
      font-size: 0.85rem;
      color: #666;
      margin-top: 4px;
    }
    .section {
      margin-bottom: 24px;
      background: #FFF9E6;
      padding: 16px;
      border-radius: 16px;
    }
    .section-title {
      font-weight: bold;
      margin-bottom: 12px;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    /* カメラ・写真エリア */
    .photo-upload {
      border: 2px dashed #FFD166;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      background: #FFFFFF;
      cursor: pointer;
      position: relative;
    }
    .photo-upload input[type="file"] {
      display: none;
    }
    .btn-camera {
      background-color: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 8px;
    }
    .btn-camera:hover {
      background-color: var(--primary-hover);
    }
    #preview-img {
      max-width: 100%;
      max-height: 200px;
      border-radius: 10px;
      margin-top: 10px;
      display: none;
    }

    /* チェック項目 */
    .balance-check {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 12px;
    }
    .check-btn {
      flex: 1;
      padding: 10px 4px;
      border: 1px solid #E0E0E0;
      border-radius: 10px;
      background: #fff;
      text-align: center;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .check-btn.active {
      background-color: #FFB703;
      color: #fff;
      border-color: #FFB703;
      font-weight: bold;
    }

    /* メモ・ボタン */
    textarea {
      width: 100%;
      border: 1px solid #DDD;
      border-radius: 10px;
      padding: 10px;
      box-sizing: border-box;
      font-size: 0.9rem;
      resize: none;
      margin-top: 10px;
    }
    .btn-submit {
      width: 100%;
      background: #2A9D8F;
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }
    .btn-submit:hover {
      background: #218376;
    }

    /* アドバイス結果表示 */
    .advice-box {
      margin-top: 20px;
      background: #E8F5E9;
      border-left: 5px solid #2A9D8F;
      padding: 14px;
      border-radius: 8px;
      display: none;
    }
    .advice-box h3 {
      margin: 0 0 8px 0;
      color: #2A9D8F;
      font-size: 1rem;
    }
    .advice-box p {
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🌻 ゆかめし 🌻</h1>
    <p>管理栄養士ゆかちゃんの ひまわりご飯ノート</p>
  </header>

  <!-- 1. ごはん記録フォーム -->
  <div class="section">
    <div class="section-title">📸 今日のごはんを撮影・記録</div>
    
    <!-- カメラ連動エリア -->
    <div class="photo-upload">
      <button class="btn-camera" onclick="document.getElementById('camera-input').click()">
        📷 カメラでパシャリ撮影
      </button>
      <br>
      <small style="color:#888;">またはアルバムから選択</small>
      
      <!-- capture="environment" でスマホの背面カメラを直接起動します -->
      <input type="file" id="camera-input" accept="image/*" capture="environment" onchange="previewPhoto(event)">
      
      <br>
      <img id="preview-img" alt="撮影写真プレビュー">
    </div>

    <!-- 栄養バランス簡単チェック -->
    <div style="margin-top: 16px;">
      <span style="font-size: 0.85rem; font-weight: bold;">バランスチェック（選んでね）</span>
      <div class="balance-check">
        <button class="check-btn" onclick="toggleCheck(this)">🍚 主食（ご飯・パン）</button>
        <button class="check-btn" onclick="toggleCheck(this)">🥩 主菜（肉・魚・卵）</button>
        <button class="check-btn" onclick="toggleCheck(this)">🥗 副菜（野菜・きのこ）</button>
      </div>
    </div>

    <!-- ひと言メモ -->
    <textarea id="memo" rows="2" placeholder="ひとことメモ（例：お腹いっぱい！、ちょっと野菜少なめだったかも）"></textarea>

    <!-- 送信ボタン -->
    <button class="btn-submit" onclick="submitMeal()">ゆかちゃんに届ける！ 🌻</button>
  </div>

  <!-- 2. ゆかちゃんからの返信エリア -->
  <div class="advice-box" id="advice-box">
    <h3>🌻 ゆかちゃんからのワンポイント 🌻</h3>
    <p id="advice-text"></p>
  </div>
</div>

<script>
  // 写真のプレビュー表示
  function previewPhoto(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = document.getElementById('preview-img');
        img.src = e.target.result;
        img.style.display = 'block';
      }
      reader.readAsDataURL(file);
    }
  }

  // チェックボタンの切り替え
  function toggleCheck(btn) {
    btn.classList.toggle('active');
  }

  // 記録送信処理（簡易デモアドバイス）
  function submitMeal() {
    const img = document.getElementById('preview-img');
    const memo = document.getElementById('memo').value;
    const adviceBox = document.getElementById('advice-box');
    const adviceText = document.getElementById('advice-text');

    if (img.style.display === 'none' && !memo) {
      alert('写真かメモをいれてね！🌻');
      return;
    }

    // デモ用のアドバイスメッセージ（ゆかちゃん口調）
    const sampleAdvices = [
      "今日もお疲れ様〜！美味しそうなお写真ありがとう！彩りもばっちりだね✨ 夜は水分しっかり摂ってゆっくり休んでね🌻",
      "しっかり食べててエライ！お肉（たんぱく質）が摂れてるから、次のご飯ではお野菜をプラスするともっと元気がでるよ〜！",
      "写真届いたよ！忙しい中ちゃんと記録できてて素晴らしい✨ 今日もごちそうさまでした！明日も無理せずね〜🌻"
    ];

    const randomAdvice = sampleAdvices[Math.floor(Math.random() * sampleAdvices.length)];

    adviceText.innerText = randomAdvice;
    adviceBox.style.display = 'block';
    adviceBox.scrollIntoView({ behavior: 'smooth' });
  }
</script>

</body>
</html>
